<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed File System</title>
    <!-- Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons for modern icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class='bx bx-cloud-light'></i>
                <span>DistriFS</span>
            </div>

            <button class="btn-primary new-btn" id="newFileBtn">
                <i class='bx bx-plus'></i>
                <span>New</span>
            </button>

            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <i class='bx bx-hdd'></i>
                    <span>My Files</span>
                </a>
                <a href="#" class="nav-item">
                    <i class='bx bx-user-check'></i>
                    <span>Shared</span>
                </a>
                <a href="#" class="nav-item">
                    <i class='bx bx-time-five'></i>
                    <span>Recent</span>
                </a>
                <a href="#" class="nav-item">
                    <i class='bx bx-star'></i>
                    <span>Starred</span>
                </a>
                <a href="#" class="nav-item">
                    <i class='bx bx-trash'></i>
                    <span>Trash</span>
                </a>
            </nav>

            <div class="storage-info">
                <div class="storage-text">
                    <span>Storage</span>
                    <span>75%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress" style="width: 75%;"></div>
                </div>
                <div class="storage-details">75 GB of 100 GB used</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <i class='bx bx-search'></i>
                    <input type="text" placeholder="Search files, folders and more...">
                </div>

                <div class="header-actions">
                    <button class="icon-btn"><i class='bx bx-bell'></i></button>
                    <button class="icon-btn"><i class='bx bx-cog'></i></button>
                    <div class="profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Profile">
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="content-header">
                    <div class="breadcrumbs" id="breadcrumbs">
                        <a href="#" data-path="/">My Files</a>
                    </div>

                    <div class="view-toggles">
                        <button class="icon-btn active" id="gridViewBtn"><i class='bx bx-grid-alt'></i></button>
                        <button class="icon-btn" id="listViewBtn"><i class='bx bx-list-ul'></i></button>
                    </div>
                </div>

                <!-- Files Section -->
                <section class="recent-files">
                    <h2 class="section-title">Files</h2>

                    <div class="list-header">
                        <div class="col-name">Name</div>
                        <div class="col-owner">Owner</div>
                        <div class="col-modified">Last Modified</div>
                        <div class="col-size">Size</div>
                        <div class="col-actions"></div>
                    </div>

                    <div class="files-list" id="filesContainer">
                        <!-- Populated by JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Create File Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <h3>Create New File</h3>
            <input type="text" id="fileNameInput" placeholder="filename.txt">
            <textarea id="fileContentInput" placeholder="File content..."></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-submit" id="submitBtn">Create</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>

</html>
